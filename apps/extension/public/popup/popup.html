<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Media Ops — Tự đăng bài</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Media Ops</strong>
      <span id="version" class="muted"></span>
    </header>

    <!-- Chưa ghép -->
    <section id="pair-view" hidden>
      <p class="muted">Ghép trình duyệt này với tài khoản nhân viên để tự đăng bài.</p>
      <label>Địa chỉ hệ thống
        <input id="server-url" type="url" placeholder="https://abc.tracker.com" required />
      </label>
      <label>Mã ghép (lấy ở trang Đăng bài → Trình duyệt)
        <input id="pair-code" maxlength="6" placeholder="ABC123" autocomplete="off" />
      </label>
      <label>Tên máy
        <input id="device-name" maxlength="80" />
      </label>
      <button id="pair-btn" class="primary">Ghép trình duyệt</button>
      <p id="pair-error" class="error" hidden></p>
    </section>

    <!-- Đã ghép -->
    <section id="status-view" hidden>
      <div class="card">
        <div id="user-name" class="title"></div>
        <div id="device-name-label" class="muted"></div>
        <div class="row">
          <span>Bài chờ đăng</span><strong id="pending-count">0</strong>
        </div>
        <label class="toggle">
          <input id="paused" type="checkbox" /> Tạm dừng tự đăng
        </label>
      </div>

      <div id="current-job" class="card running" hidden></div>
      <p id="last-error" class="error" hidden></p>

      <div class="card">
        <div class="title small">Kênh phụ trách</div>
        <ul id="channels"></ul>
      </div>

      <div class="card">
        <div class="title small">Lịch sử gần đây</div>
        <ul id="log"></ul>
      </div>

      <div class="actions">
        <button id="tick-btn">Kiểm tra ngay</button>
        <button id="open-web-btn">Mở hệ thống</button>
        <button id="unpair-btn" class="danger">Ngắt kết nối</button>
      </div>
      <p class="muted tiny">
        Giữ trình duyệt mở và đăng nhập sẵn Facebook / TikTok / YouTube của các kênh trên.
        Extension sẽ mở cửa sổ riêng để đăng rồi tự đóng.
      </p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
